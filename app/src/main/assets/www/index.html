<!DOCTYPE html>
<html lang="en" data-sheet="bottom" data-btn="soft" data-tabs="seg" data-tb="dock" data-fx="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#17181a">
<title>Chess Variants</title>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/themes.css">
</head>
<body>
<div class="amb" aria-hidden="true"></div>
<div class="bar"><h1>Chess Variants</h1><button id="mn" aria-expanded="false" aria-controls="menu" aria-label="Menu">&#9776;</button></div>
<div id="sbg"></div>
<div id="menu" role="dialog" aria-label="Menu">
<button class="mx" id="mx" aria-label="Close menu">&#10005;</button>
<div class="grab" id="grab"></div>
<div class="tabs" id="tabs"><i class="ind"></i><button data-t="new">Play</button><button data-t="game">Game</button><button data-t="lib">Library</button><button data-t="set">Settings</button></div>
<div class="pane" id="p_new">
<div class="lb">Surface</div><div class="opts grid" id="tm"></div><div class="info" id="sinfo"></div>
<div class="lb">Opponent</div><div class="row ibr" id="to"></div>
<div id="lvbox"><div class="lb" id="lvlb">Level</div><div class="row ibr" id="tm2"></div></div>
<div class="cap" id="mcap"></div><div class="cap" id="ocap"></div>
<div id="sc"><div class="lb">Play as</div><div class="row ibr" id="tc"></div><div class="cap" id="scap"></div></div>
<div class="lb">Time control</div><div class="row" id="tpre"></div><div id="tcs"></div>
<div class="pend" id="pend" hidden></div>
<button class="go" id="ng">Start game</button>
</div>
<div class="pane" id="p_game" hidden>
<div class="lb">This game</div>
<div class="list"><button id="rvg" disabled>Review game</button><button id="cl" disabled>Claim draw</button><button id="ag">Draw by agreement</button></div>
<div class="lb">Share</div>
<div class="list"><button id="cpg" data-l="Copy PGN">Copy PGN</button><button id="cfn" data-l="Copy FEN">Copy FEN</button></div>
<div class="info" id="info"></div>
</div>
<div class="pane" id="p_lib" hidden>
<div class="lb">Saved games <span id="hcount"></span></div><div id="hl"></div>
<div class="lb">Import a game</div>
<textarea id="imp" rows="5" spellcheck="false" placeholder="Paste a PGN, or a FEN to play from a position"></textarea>
<div class="row"><button id="impGo">Load</button><button id="impPaste">Paste</button></div><div class="cap" id="impMsg"></div>
</div>
<div class="pane" id="p_set" hidden>
<div class="lb">Appearance</div><div class="opts grid" id="thg"></div><div class="list"><button id="mst"></button></div>
<div class="lb">Board</div><div class="list"><button id="hint"></button><button id="crd"></button><button id="aq"></button><button id="flip"></button><button id="fp"></button></div>
<div class="lb">Sound &amp; feedback</div><div class="list"><button id="snd"></button><button id="hap"></button><button id="anm"></button></div>
<div class="lb">Screen</div><div class="list"><button id="fs"></button><button id="wake"></button></div>
</div>
</div>
<div id="st" role="status" aria-live="polite"></div>
<div class="strip" id="ts2"></div>
<div class="bw"><button id="vb" class="vbadge" hidden></button><canvas id="cv" width="560" height="560" role="img" aria-label="Chess board"></canvas><div id="pk"><div id="pkp"></div></div></div>
<div class="strip" id="bs2"></div>
<div class="res" id="res" hidden><div class="rt" id="rt"></div><div class="rbt"><button id="rm">Rematch</button><button id="rvb" class="rvbtn" hidden>Review game</button><button id="rn">New game</button></div></div>
<div class="tb"><button id="ub"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg><span>Undo</span></button><button id="ht"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z"/></svg><span>Hint</span></button><button id="fm"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M7 4L3.5 7.5M7 4l3.5 3.5M17 20V4M17 20l-3.5-3.5M17 20l3.5-3.5"/></svg><span>Flip</span></button><button id="rs"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg><span>Resign</span></button><button id="nw"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span>New</span></button></div>
<div class="mv"><button id="vf" aria-label="First move"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5v14M18 6l-8 6 8 6z"/></svg></button><button id="vp" aria-label="Previous move"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button><div class="ml" id="ml"></div><button id="vn" aria-label="Next move"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button><button id="vl" aria-label="Latest move"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 5v14M6 6l8 6-8 6z"/></svg></button></div>
<div class="rv" id="rv" hidden>
<div class="rvh"><b>Game review</b><button id="rvX" aria-label="Close review">Close</button></div>
<div id="rvP"><div class="rvb"><i id="rvBar"></i></div><div id="rvPt"></div></div>
<div id="rvR" hidden>
<div id="rvSumBox">
<div class="rvac" id="rvAcc"></div>
<canvas id="rvG" height="64" aria-label="Evaluation graph"></canvas>
<div class="rvt" id="rvS"></div>
<div id="rvK"></div>
<button class="rvgo" id="rvGo">Start walkthrough &#9654;</button>
</div>
<div id="rvWalk" hidden>
<div class="rvc" id="rvC"></div>
<div class="rvn"><button id="rvPrev">&#9664; Previous</button><button id="rvNext" class="main">Next &#9654;</button></div>
<div class="rvn"><button id="rvPM">&#9664; Mistake</button><button id="rvM">Mistake &#9654;</button></div>
<canvas id="rvG2" height="64" aria-label="Evaluation graph"></canvas>
<button id="rvBack">Summary</button>
</div>
</div>
<div class="lb">Analysed by</div>
<div class="sg" id="rvEng"></div>
<div class="sg" id="rvLv"></div>
</div>
<script src="js/pieces-classic.js"></script>
<script src="js/pieces.js"></script>
<script src="js/theme.js"></script>
<script src="js/maia.js"></script>
<script src="js/maia-proxy.js"></script>
<script src="js/sf.js"></script>
<script src="js/engine.js"></script>
<script src="js/engine-wasm.js"></script>
<script src="js/engine-proxy.js"></script>
<script src="js/app.js"></script>
<script src="js/games.js"></script>
<script src="js/review.js"></script>
</body>
</html>
