name: Build signed Android APK

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Increasing Android versionCode
        required: true
        default: '4'
        type: string
      version_name:
        description: Display version (for example 2.1)
        required: true
        default: '2.1'
        type: string

permissions:
  contents: read

jobs:
  signed-apk:
    # Signing only runs explicitly from the repository's default branch, never from a PR.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VERSION_CODE: ${{ inputs.version_code }}
      VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate versions and restore signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          import re
          import sys
          code = os.environ['VERSION_CODE']
          if not re.fullmatch(r'[1-9][0-9]{0,9}', code) or int(code) > 2147483647:
              sys.exit('version_code must be a positive Android integer.')
          if not re.fullmatch(r'[0-9]+(?:\.[0-9]+){1,2}', os.environ['VERSION_NAME']):
              sys.exit('version_name must have the form 2.1 or 2.1.0.')
          key = os.environ.get('ANDROID_KEYSTORE_BASE64', '')
          password = os.environ.get('ANDROID_KEYSTORE_PASSWORD', '')
          if not key or not password:
              sys.exit('Configure ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD in repository Actions secrets.')
          try:
              decoded = base64.b64decode(key, validate=True)
          except ValueError:
              sys.exit('ANDROID_KEYSTORE_BASE64 is not valid base64.')
          folder = Path(os.environ['RUNNER_TEMP']) / 'chess-signing'
          folder.mkdir(mode=0o700)
          for filename, contents in [('release.keystore', decoded), ('password.txt', (password + '\n').encode())]:
              with os.fdopen(os.open(folder / filename, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600), 'wb') as file:
                  file.write(contents)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'KS_FILE={folder / "release.keystore"}\n')
              env.write(f'KS_PASS_FILE={folder / "password.txt"}\n')
          PY
      - name: Verify signing identity
        run: |
          keytool -exportcert -keystore "$KS_FILE" -storepass:file "$KS_PASS_FILE" -alias cos -file "$RUNNER_TEMP/chess-signing/certificate.der"
          openssl x509 -in signing/release-certificate.pem -outform DER -out "$RUNNER_TEMP/chess-signing/expected.der"
          cmp "$RUNNER_TEMP/chess-signing/certificate.der" "$RUNNER_TEMP/chess-signing/expected.der"
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build and verify signed APK
        run: ./build.sh
      - name: Upload APK only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ChessVariants-${{ inputs.version_code }}
          path: build/ChessVariants-${{ inputs.version_code }}.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          shutil.rmtree(Path(os.environ['RUNNER_TEMP']) / 'chess-signing', ignore_errors=True)
          PY
