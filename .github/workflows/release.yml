# Builds the APK, signs it with the key stored in repository secrets, and publishes a GitHub Release.
# Without these secrets the run still works, but signs with a one-off key.
# One-time setup (Settings > Secrets and variables > Actions):
#   KEYSTORE_BASE64  base64 of your release keystore   (base64 -w0 release.keystore)
#   KS_PASS          the keystore password (also used as the key password; alias must be "cos")
# Run it from the Actions tab (Run workflow) with the version name and code.
name: Release APK
on:
  workflow_dispatch:
    inputs:
      version_name: { description: "Version name (tag will be v<name>)", required: true, default: "2.0" }
      version_code: { description: "Android versionCode (must increase each release)", required: true, default: "3" }
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Android build tools
        run: sudo apt-get update && sudo apt-get install -y aapt apksigner zipalign dalvik-exchange android-sdk-platform-23
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SECRET_PASS" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KS_PASS=$SECRET_PASS" >> "$GITHUB_ENV"
            echo "KEY_KIND=your repository key" >> "$GITHUB_ENV"
          else
            # No secrets set: build.sh generates a one-off key (discarded after the run).
            pass=$(openssl rand -hex 16); echo "::add-mask::$pass"
            echo "KS_PASS=$pass" >> "$GITHUB_ENV"
            echo "KEY_KIND=ONE-OFF key (not persisted): it cannot update installs signed with another key. Add KEYSTORE_BASE64 and KS_PASS secrets for stable releases." >> "$GITHUB_ENV"
          fi
      - name: Build and sign
        env:
          KS_FILE: ${{ runner.temp }}/release.keystore
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: ./build.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          mv ChessVariants.apk "ChessVariants-$VERSION_NAME.apk"
          sha=$(sha256sum "ChessVariants-$VERSION_NAME.apk" | cut -d' ' -f1)
          gh release create "v$VERSION_NAME" "ChessVariants-$VERSION_NAME.apk" --target "$GITHUB_SHA" \
            --title "v$VERSION_NAME" --notes "Chess on Surfaces $VERSION_NAME (versionCode ${{ inputs.version_code }}). Min Android 5.0 (API 21).

          SHA-256: $sha

          Signed with: $KEY_KIND"
